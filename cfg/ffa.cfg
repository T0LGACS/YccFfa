// YCC TEAM FFA sunucusu (2026-11-16): herkes herkese deathmatch. Silah turlarını YccFfa eklentisi değiştirir
// (mp_*_default_primary/secondary'yi o yazar, buraya yazma). Her harita yüklenişinde sunucu.cfg'den çalışır.
mp_teammates_are_enemies 1
mp_randomspawn 1
mp_randomspawn_los 1
mp_respawn_on_death_t 1
mp_respawn_on_death_ct 1
mp_respawn_immunitytime 2
mp_buy_anywhere 0
mp_buytime 0
mp_buy_allow_grenades 0
mp_startmoney 0
mp_free_armor 2
mp_death_drop_gun 0
mp_death_drop_grenade 0
mp_death_drop_defuser 0
mp_weapons_allow_map_placed 0
mp_weapons_allow_zeus 0
sv_infinite_ammo 2
mp_timelimit 20
mp_maxrounds 0
mp_warmuptime 5
mp_autoteambalance 0
mp_limitteams 0
mp_dm_bonus_percent 0
mp_dm_bonus_length_min 0
mp_dm_bonus_length_max 0
mp_dm_time_between_bonus_min 9999
mp_dm_time_between_bonus_max 9999
cash_player_killed_enemy_default 0
cash_player_killed_teammate 0
mp_ct_default_melee weapon_knife
mp_t_default_melee weapon_knife
// Botlar boşluğu doldurur (2026-11-16): toplam 8 kişiye kadar bot, oyuncu girdikçe bot çıkar. Sunucu boşken bot yok
// (bot_join_after_player), böylece boş sunucu işlemci harcamaz. 6 botla FFA sunucusu bir çekirdeğin ~%33'ünü kullandı.
bot_quota 8
bot_quota_mode fill
bot_join_after_player 1
bot_difficulty 2
bot_chatter off
bot_dont_shoot 0
// Harita süresi bitince haritayı YccFfa değiştirir (sıradaki harita): oyun kendisi yeniden başlatmasın
mp_match_end_restart 0
mp_match_end_changelevel 0
mp_match_restart_delay 15
